# secret-board deployment. Variables come from a .env file next to this
# compose file - start from .env.example.
#
# First run (builds the images from this checkout, no registry needed):
#   cp .env.example .env            # then fill in the secrets
#   docker compose up -d --build
#
# Only caddy is exposed: HTTP_PORT (default 8088, redirects to HTTPS) and
# HTTPS_PORT (default 8443). 80 / 443 are left alone so other projects on the
# same machine can keep them. The portal and the backend stay internal to the
# compose network.
#
# Users open https://${SITE_ADDRESS}:${HTTPS_PORT}. Change either value and the
# Google OAuth client's origin / redirect URI must change with it.
#
# Logging: json-file with a small cap. No service writes per-request access
# logs (docs/anonymity.md), so these hold startup / error lines only.

services:
  ######################################################################################################################
  # caddy (TLS terminator / reverse proxy; the ONLY exposed service)
  caddy:
    image: caddy:2.10
    # Same number on both sides: Caddy has to know the public HTTPS port to
    # build its http -> https redirect (see Caddyfile).
    ports:
      - "${HTTP_PORT:-8088}:${HTTP_PORT:-8088}"
      - "${HTTPS_PORT:-8443}:${HTTPS_PORT:-8443}"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      HTTP_PORT: ${HTTP_PORT:-8088}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own CA for `tls internal`. Keep it, or every restart mints a
      # new CA and users see the certificate warning again.
      - caddy-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      - portal

  ######################################################################################################################
  # backend (posts / comments; never receives user identity)
  backend:
    image: ${IMAGE_REPO:-secret-board}:${SECRET_BOARD_VERSION}
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      target: secret-board-backend
      args:
        ARG_SECRET_BOARD_VERSION: ${SECRET_BOARD_VERSION}
    environment:
      SECRET_BOARD_SERVER_ADDRESS: :8080
      SECRET_BOARD_BACKEND_SECRET: ${SECRET_BOARD_BACKEND_SECRET}
      TZ: ${TIMEZONE:-Asia/Seoul}
    volumes:
      - backend-data:/var/secret-board/backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3

  ######################################################################################################################
  # portal (SvelteKit BFF + Google sign-in, served through caddy)
  portal:
    image: ${IMAGE_REPO:-secret-board}:${SECRET_BOARD_VERSION}-portal
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      target: secret-board-portal
      args:
        ARG_SECRET_BOARD_VERSION: ${SECRET_BOARD_VERSION}
    environment:
      # adapter-node: ORIGIN must match the public URL users open, port included.
      PORT: 3000
      ORIGIN: https://${SITE_ADDRESS}:${HTTPS_PORT:-8443}
      BETTER_AUTH_URL: https://${SITE_ADDRESS}:${HTTPS_PORT:-8443}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-corelinesoft.com}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SECRET_BOARD_BACKEND_URL: http://backend:8080
      SECRET_BOARD_BACKEND_SECRET: ${SECRET_BOARD_BACKEND_SECRET}
      TZ: ${TIMEZONE:-Asia/Seoul}
    volumes:
      - portal-data:/var/secret-board/portal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    depends_on:
      - backend

# Named volumes, not ./vol bind mounts: the portal and backend run as non-root
# users, and a named volume inherits the image directory's owner on first use,
# so the DB files are writable on Linux hosts too.
volumes:
  caddy-data:
  backend-data:
  portal-data:
