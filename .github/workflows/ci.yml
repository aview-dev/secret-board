# CI: every push / PR runs backend tests and the portal typecheck + build, then
# checks that both docker images build. A pushed tag vX.Y.Z also publishes the
# images to GHCR as ghcr.io/<owner>/secret-board:<version>[-portal].

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
      - run: go vet ./...
      - run: go test ./...

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/portal
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-node@v4
        with:
          node-version: 24.7.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run build
        env:
          BETTER_AUTH_SECRET: ci-placeholder-not-a-secret

  docker:
    needs: [backend, portal]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and image repo
        run: |
          echo "SECRET_BOARD_VERSION=$(sed -n 's/^SECRET_BOARD_VERSION=//p' VERSION)" >> "$GITHUB_ENV"
          echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/secret-board" >> "$GITHUB_ENV"
      - name: Tag must match VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$SECRET_BOARD_VERSION"
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on tag)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash docker/build-docker-images.sh --upload
          else
            bash docker/build-docker-images.sh
          fi
